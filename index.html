<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#121830"><title>Neon Golf · 24</title><style>*{box-sizing:border-box}body{margin:0;background:#101629;color:#fff;font:15px system-ui;overflow:hidden;touch-action:none}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#18213b}h1{font-size:19px;margin:0}small{color:#abc3e2}button{border:0;border-radius:14px;background:#304362;color:white;padding:12px;font-weight:700;cursor:pointer}button:active{transform:scale(.96)}canvas{display:block;width:100%;height:calc(100dvh - 146px)}footer{height:70px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#18213b;gap:8px}#tip{font-size:12px;color:#bdcee9;max-width:260px}.overlay{position:fixed;inset:0;background:#0a1026dd;display:flex;align-items:center;justify-content:center;padding:20px;z-index:3}.hidden{display:none}.card{width:min(460px,100%);max-height:90dvh;overflow:auto;background:#1d2a46;padding:24px;border-radius:26px;box-shadow:0 20px 100px #0008}.card h2{margin-top:0}.primary{background:#57e4bd;color:#0c2832}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:18px 0}.grid button{padding:12px 0}.grid button:disabled{opacity:.3}p{line-height:1.6;color:#c2d3ec}.row{display:flex;gap:10px;flex-wrap:wrap}#toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:#1e3452;padding:10px 18px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .2}</style><header><div><h1>⛳ Neon Golf</h1><small id="stats"></small></div><div><button id="sound" aria-label="Dźwięk">🔊</button> <button id="menu" aria-label="Wybierz poziom">☰</button></div></header><canvas id="game" aria-label="Pole golfowe. Przeciągnij od piłki w przeciwnym kierunku do strzału."></canvas><footer><span id="tip">Przeciągnij od piłki do tyłu i puść. Dłuższa linia = mocniejszy strzał.</span><button id="restart">↻ Restart</button></footer><div id="modal" class="overlay"><div class="card" id="panel"></div></div><div id="toast"></div><script>
'use strict';
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),W=360,H=640,KEY='neongolf24-v1';
let save={unlocked:1,best:{},current:1,sound:true};try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let level=1,shots=0,ball,obstacles=[],sand=[],water=[],pads=[],hole,aim=null,moving=false,won=false,last=0,acc=0,scale=1,ox=0,oy=0,audio=null,confetti=[],toastTimer;
const colors=['#153f49','#332e59','#19415a','#493448','#244936','#3c395c'];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){toast('Zapis niedostępny w tej przeglądarce')}}
function toast(t){$('#toast').textContent=t;$('#toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.opacity=0,2300)}
function tone(f=440,d=.09,type='sine',vol=.07){if(!save.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,f/2),audio.currentTime+d);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function stats(){$('#stats').textContent=`Poziom ${level}/24 · Uderzenia: ${shots} · Rekord: ${save.best[level]||'—'}`;$('#sound').textContent=save.sound?'🔊':'🔇'}
function rect(x,y,w,h){return{x,y,w,h}}
function start(n){level=n;shots=0;won=false;moving=false;aim=null;confetti=[];ball={x:70,y:565,vx:0,vy:0,r:8};hole={x:285,y:75};obstacles=[];sand=[];water=[];pads=[];
let stage=(n-1)%6,tier=Math.floor((n-1)/6);
if(stage===0){obstacles.push(rect(35,330,220,22));if(tier>0)obstacles.push(rect(140,170,185,20))}
if(stage===1){obstacles.push(rect(120,220,24,290),rect(235,95,24,280));hole={x:300,y:100}}
if(stage===2){obstacles.push(rect(25,420,220,22),rect(115,240,220,22));hole={x:65,y:100}}
if(stage===3){obstacles.push(rect(155,155,25,300));sand.push(rect(30,275,115,95));hole={x:280,y:540}}
if(stage===4){obstacles.push(rect(25,340,120,22),rect(215,340,120,22),rect(140,170,80,22));water.push(rect(145,270,70,45));hole={x:285,y:75}}
if(stage===5){obstacles.push(rect(100,420,235,20),rect(25,270,225,20),rect(110,140,225,20));hole={x:65,y:80}}
if(tier>=1){sand.push(rect(220,465,90,65));pads.push({x:70,y:210,r:19,dx:0,dy:-1})}
if(tier>=2){water.push(rect(265,205,55,60));obstacles.push(rect(45,490,65,16));ball.x=170}
if(tier>=3){sand.push(rect(35,95,80,55));pads.push({x:295,y:390,r:18,dx:-1,dy:-.3});obstacles.push(rect(170,65,20,70))}
save.current=n;persist();stats();$('#modal').classList.add('hidden')}
function menu(){aim=null;$('#modal').classList.remove('hidden');$('#panel').innerHTML=`<h2>⛳ Neon Golf · 24</h2><p>24 kolorowe pola, bandy, piasek, woda i pola przyspieszenia. Poziomy odblokujesz po kolei. Postęp i najlepsze wyniki zapisują się na tym urządzeniu.</p><div class="grid">${Array.from({length:24},(_,i)=>`<button ${i+1>save.unlocked?'disabled':''} data-level="${i+1}" style="${i+1===level?'background:#2b987f':''}">${i+1}${save.best[i+1]?' ★':''}</button>`).join('')}</div><div class="row"><button class="primary" id="continue">Graj dalej →</button><button id="help">Jak grać?</button></div>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{tone();start(+b.dataset.level)});$('#continue').onclick=()=>{tone();start(Math.min(save.current,save.unlocked))};$('#help').onclick=()=>toast('Celuj od piłki do tyłu. Złote pole przyspiesza, piasek hamuje, woda cofa.')}
function finish(){won=true;moving=false;ball.x=hole.x;ball.y=hole.y;ball.vx=ball.vy=0;save.best[level]=Math.min(save.best[level]||Infinity,shots);save.unlocked=Math.max(save.unlocked,Math.min(24,level+1));save.current=Math.min(24,level+1);persist();stats();[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*130));confetti=Array.from({length:65},()=>({x:hole.x,y:hole.y,vx:(Math.random()-.5)*280,vy:-Math.random()*280,c:['#58e8b8','#ffe384','#ec86bd'][Math.floor(Math.random()*3)],life:2}));setTimeout(()=>{if(!won)return;$('#modal').classList.remove('hidden');$('#panel').innerHTML=`<h2>${level===24?'🏆 Wszystkie pola ukończone!':'⛳ Piłka w dołku!'}</h2><p>Poziom ${level}/24 · Uderzenia: ${shots}<br>Najlepszy wynik: ${save.best[level]}<br>Ukończone pola: ${Object.keys(save.best).length}/24</p><div class="row"><button class="primary" id="next">${level<24?'Następny poziom →':'Wybierz pole'}</button><button id="again">Zagraj ponownie</button></div>`;$('#next').onclick=()=>level<24?start(level+1):menu();$('#again').onclick=()=>start(level)},750)}
function inside(b,r){return b.x>r.x&&b.x<r.x+r.w&&b.y>r.y&&b.y<r.y+r.h}
function step(dt){confetti.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt});confetti=confetti.filter(p=>p.life>0);if(!moving||won)return;
let friction=sand.some(r=>inside(ball,r))?3.4:.58;ball.vx*=Math.exp(-friction*dt);ball.vy*=Math.exp(-friction*dt);
for(let p of pads)if(Math.hypot(ball.x-p.x,ball.y-p.y)<p.r){ball.vx+=p.dx*430*dt;ball.vy+=p.dy*430*dt}
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.x<25+ball.r){ball.x=25+ball.r;ball.vx=Math.abs(ball.vx)*.8;tone(230,.04)}if(ball.x>335-ball.r){ball.x=335-ball.r;ball.vx=-Math.abs(ball.vx)*.8;tone(230,.04)}if(ball.y<25+ball.r){ball.y=25+ball.r;ball.vy=Math.abs(ball.vy)*.8;tone(230,.04)}if(ball.y>615-ball.r){ball.y=615-ball.r;ball.vy=-Math.abs(ball.vy)*.8;tone(230,.04)}
for(let r of obstacles){let nx=Math.max(r.x,Math.min(ball.x,r.x+r.w)),ny=Math.max(r.y,Math.min(ball.y,r.y+r.h)),dx=ball.x-nx,dy=ball.y-ny,dist=Math.hypot(dx,dy);if(dist<ball.r){if(dist===0){let edges=[{d:ball.x-r.x,x:-1,y:0},{d:r.x+r.w-ball.x,x:1,y:0},{d:ball.y-r.y,x:0,y:-1},{d:r.y+r.h-ball.y,x:0,y:1}].sort((a,b)=>a.d-b.d);dx=edges[0].x;dy=edges[0].y;ball.x+=dx*(edges[0].d+ball.r);ball.y+=dy*(edges[0].d+ball.r)}else{dx/=dist;dy/=dist;ball.x+=dx*(ball.r-dist);ball.y+=dy*(ball.r-dist)}let dot=ball.vx*dx+ball.vy*dy;if(dot<0){ball.vx-=1.8*dot*dx;ball.vy-=1.8*dot*dy;tone(300,.04)}}}
if(water.some(r=>inside(ball,r))){ball.x=ball.safeX;ball.y=ball.safeY;ball.vx=ball.vy=0;moving=false;tone(130,.3,'triangle');toast('Woda! Wracasz na miejsce poprzedniego strzału.');return}
let speed=Math.hypot(ball.vx,ball.vy),d=Math.hypot(ball.x-hole.x,ball.y-hole.y);if(d<13&&speed<155){finish();return}if(speed<7){ball.vx=ball.vy=0;moving=false}}
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(t){const dpr=Math.min(devicePixelRatio||1,2),cw=canvas.clientWidth,ch=canvas.clientHeight;if(canvas.width!==Math.round(cw*dpr)||canvas.height!==Math.round(ch*dpr)){canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);scale=Math.min(cw/W,ch/H);ox=(cw-W*scale)/2;oy=(ch-H*scale)/2;ctx.translate(ox,oy);ctx.scale(scale,scale);rounded(14,14,332,612,24,'#0b2331');rounded(25,25,310,590,15,colors[Math.floor((level-1)/4)]);ctx.save();ctx.beginPath();ctx.rect(25,25,310,590);ctx.clip();ctx.strokeStyle='#ffffff06';ctx.lineWidth=18;for(let y=0;y<700;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(360,y-180);ctx.stroke()}ctx.restore();
for(let r of sand){rounded(r.x,r.y,r.w,r.h,12,'#ddbd72');ctx.fillStyle='#ae8c48';for(let i=0;i<18;i++)ctx.fillRect(r.x+7+(i*37)%(r.w-14),r.y+7+(i*23)%(r.h-14),2,2)}
for(let r of water){rounded(r.x,r.y,r.w,r.h,9,'#299bd3');ctx.strokeStyle='#9be8ff';for(let j=12;j<r.h;j+=14){ctx.beginPath();ctx.moveTo(r.x+8,r.y+j);ctx.quadraticCurveTo(r.x+r.w/2,r.y+j+Math.sin(t/500+j)*5,r.x+r.w-8,r.y+j);ctx.stroke()}}
for(let p of pads){ctx.fillStyle='#ffd45d';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#705828';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText(p.dx===0?'↑':'↖',p.x,p.y+8)}
for(let r of obstacles){rounded(r.x,r.y+4,r.w,r.h,6,'#0005');rounded(r.x,r.y,r.w,r.h,5,'#b1e0dc');rounded(r.x+2,r.y+2,r.w-4,4,2,'#ffffff80')}
ctx.fillStyle='#071821';ctx.beginPath();ctx.arc(hole.x,hole.y,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff40';ctx.stroke();ctx.strokeStyle='#e9f0ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hole.x,hole.y-6);ctx.lineTo(hole.x,hole.y-48);ctx.stroke();ctx.fillStyle='#ff819d';ctx.beginPath();ctx.moveTo(hole.x,hole.y-48);ctx.lineTo(hole.x+27,hole.y-38);ctx.lineTo(hole.x,hole.y-29);ctx.fill();
if(aim){let dx=ball.x-aim.x,dy=ball.y-aim.y,len=Math.hypot(dx,dy),m=Math.min(len,115),nx=dx/(len||1),ny=dy/(len||1);ctx.strokeStyle='#ffe48b';ctx.lineWidth=3;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+nx*m,ball.y+ny*m);ctx.stroke();ctx.setLineDash([]);rounded(100,630,160,5,2,'#ffffff33');rounded(100,630,160*m/115,5,2,'#ffe48b')}
if(ball){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(ball.x+2,ball.y+5,9,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ccd7e2';ctx.beginPath();ctx.arc(ball.x+2,ball.y+2,2,0,Math.PI*2);ctx.fill()}
for(let p of confetti){ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5)}
}
function frame(t){if(!last)last=t;acc+=Math.min((t-last)/1000,.05);last=t;while(acc>=1/120){if($('#modal').classList.contains('hidden'))step(1/120);acc-=1/120}draw(t);requestAnimationFrame(frame)}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
canvas.onpointerdown=e=>{if(moving||won||!$('#modal').classList.contains('hidden'))return;let p=point(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)>65){toast('Zacznij przeciąganie blisko piłki');return}tone(600,.02,'sine',.01);aim=p;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(aim)aim=point(e)};canvas.onpointerup=e=>{if(!aim)return;let p=point(e),dx=ball.x-p.x,dy=ball.y-p.y,l=Math.hypot(dx,dy);aim=null;if(l<6)return;let power=Math.min(l,115)*4.5;ball.safeX=ball.x;ball.safeY=ball.y;ball.vx=dx/l*power;ball.vy=dy/l*power;moving=true;shots++;stats();tone(650,.09,'triangle')};canvas.onpointercancel=()=>aim=null;
$('#restart').onclick=()=>{tone();start(level)};$('#menu').onclick=menu;$('#sound').onclick=()=>{save.sound=!save.sound;persist();stats();tone()};document.addEventListener('visibilitychange',()=>{last=0;acc=0;aim=null});level=Math.min(save.current,save.unlocked);start(level);menu();requestAnimationFrame(frame);
</script></html>
